[project]
name = "drivion"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pillow",
    "pydantic>=2.12,<3",
    # Used by runtime verification to parse dependency requirements.
    "packaging",
    "pandas",
    "opencv-python-headless",
    "scikit-learn",
    "tensorflow",
    "onnxruntime",
    "xgboost-cpu",
    "lightgbm",
    "art",
    "pyserial",
    "evdev",
    "tzlocal",
    "python-dotenv",
    "ai-edge-litert==2.3.0",
    "torch",
    "torchvision",
    # Match Raspberry Pi OS NumPy to preserve Picamera2 extension compatibility.
    "numpy==2.2.4",
    "tomlkit>=0.13,<1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

[tool.uv.sources]
# Repair upstream dependency metadata; retain the verified upstream binaries.
ai-edge-litert = { path = "vendor/ai_edge_litert" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.drivion.verification]
command_timeout_seconds = 180

[tool.drivion.verification.imports]
opencv-python-headless = "cv2"
scikit-learn = "sklearn"
xgboost-cpu = "xgboost"
pyserial = "serial"
python-dotenv = "dotenv"
ai-edge-litert = "ai_edge_litert.interpreter"

[tool.drivion.uv]
installer_url = "https://astral.sh/uv/install.sh"
executable_directory = "/usr/local/bin"

[tool.drivion.arduino]
cli_version = "1.5.1"
cli_archive_name = "arduino-cli_1.5.1_Linux_ARM64"
cli_archive_sha256 = "1e69e077479f300614d4551334e0a33f08ee40b04315d83b8e7e0e94f0d0ee62"
cli_release_url = "https://github.com/arduino/arduino-cli/releases/download/v1.5.1"
cli_install_directory = "/opt/drivion/arduino-cli/1.5.1"
cli_archive_executable = "arduino-cli"
cli_executable_path = "/usr/local/bin/arduino-cli"
# These paths are relative to the Raspberry Pi user's home directory.
data_directory = ".arduino15"
download_directory = ".arduino15/staging"
config_path = ".arduino15/arduino-cli.yaml"
service_config_path = "/etc/drivion/arduino-cli.yaml"
serial_group = "dialout"
avr_core = "arduino:avr"
avr_core_version = "1.8.6"
discovery_timeout_seconds = 3
command_timeout_seconds = 30

[tool.drivion.firmware_compile]
library_directory = "system/arduino/library"
build_directory = "system/arduino/build"
header_filename = "drivion_generated.h"
manifest_filename = "firmware.toml"
definition_filename = "firmware.toml"
command_timeout_seconds = 300

[tool.drivion.firmware_flash]
log_directory = "system/arduino/logs"
command_timeout_seconds = 120
query_command = "INFO"
boot_wait_seconds = 2.0
query_timeout_seconds = 5.0
read_timeout_seconds = 0.2
max_response_bytes = 1024

[tool.drivion.services]
python_executable = "/usr/bin/python3"
library_directory = "/usr/local/lib/drivion"
configuration_directory = "/etc/drivion"
unit_directory = "/etc/systemd/system"
reboot_required_path = "/var/run/reboot-required"
temporary_directory = "/tmp"

[tool.drivion.execution]
apt_lock_timeout_seconds = 120
uv_concurrent_downloads = 2
uv_concurrent_builds = 1
uv_concurrent_installs = 1
numerical_thread_limit = 1

[tool.drivion.provisioning]
packages = [
    "python3-picamera2",
    "python3-venv",
    "python3-apt",
    "rpicam-apps-lite",
    "rsync",
    "curl",
    "wget",
    "ca-certificates",
    "git",
    "python3-dev",
    "build-essential",
    "linux-libc-dev",
    "libgomp1",
    "dnsmasq-base",
    "network-manager",
    "openssh-server",
]
system_imports = ["picamera2", "libcamera"]
