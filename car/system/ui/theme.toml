# Shared ANSI SGR palette for every terminal UI element.
[styles]
cyan = 36 # Selection, title, and progress
amber = 33 # Ignore
red = 31 # Validation errors
green = 32 # Success
gray = 90 # Muted UI details
bold = 1
dim = 2
reset = 0

[banner]
muted_letters = 3
muted_rgb = [150, 147, 142]
bright_rgb = [229, 229, 229]
muted_shadow_rgb = [55, 54, 53]
bright_shadow_rgb = [75, 75, 75]

# Equal-width rows; _ is a shaded space and ^ a shaded upper half block.
[banner.glyphs]
D = ["█▀▀▄", "█__█", "▀▀▀ "]
R = ["█▀▀▄", "█^^▄", "▀  ▀"]
I = ["▀█▀", " █ ", "▀▀▀"]
V = ["█  █", "█__█", " ▀▀ "]
O = ["█▀▀█", "█__█", "▀▀▀▀"]
N = ["█▄ █", "█ ▀█", "▀  ▀"]


# Optional muted descriptions, keyed by menu title and option label.
[menus."Drivion system management"]
"System Info" = "View hardware and deployment details"
Arduino = "Identify devices and manage firmware"
Joystick = "Identify a controller and configure controls"
"Hardware tests" = "Check camera and Arduino communication with latency logs"

[menus.Arduino]
"Identify and select device" = "Find a connected board"
"Change firmware" = "Compile and flash a registered sketch"
"Check firmware" = "Verify the running firmware"

[menus.Joystick]
"Identify and select device" = "Find and save a connected controller"
"Configure controls" = "Calibrate sticks, modes, and reverse driving"
"Check controls" = "Monitor saved joystick settings"

# Display settings only; driving and input polling keep their own cadence.
[drive_monitor]
gauge_cells_per_side = 10
refresh_seconds = 0.1
speed_color = "cyan"
steering_color = "amber"
row_spacing = 1 # Blank lines between the two controls.
