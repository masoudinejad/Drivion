# Shared ANSI SGR palette for every terminal UI element.
[styles]
cyan = 36 # Selection, title, and progress
amber = 33 # Ignore
red = 31 # Validation errors
green = 32 # Success
gray = 90 # Banner borders
bold = 1
dim = 2
reset = 0


# Optional muted descriptions, keyed by menu title and option label.
[menus."Drivion system management"]
"System Info" = "View hardware and deployment details"
Arduino = "Identify devices and manage firmware"

[menus.Arduino]
"Identify and select device" = "Find a connected board"
"Change firmware" = "Compile and flash a registered sketch"
"Check firmware" = "Verify the running firmware"
