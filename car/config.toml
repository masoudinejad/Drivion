# Central settings shared by the driving application and system tools.

[system.python_environment]
name = "drivion"
path = "system/env/drivion"

[system.network]
command_path = "/usr/bin/nmcli"
wifi_interface = "wlan0"
fallback_profile = "drivion-hotspot"
fallback_ssid_prefix = "Drivion"
fallback_ssid_serial_characters = 6
fallback_ipv4_address = "10.42.0.1"
fallback_ipv4_prefix_length = 24
fallback_delay_seconds = 60
fallback_timer_accuracy_seconds = 1
command_timeout_seconds = 30

[arduino]
# Use "auto" only when exactly one port is expected to be connected.
address = "auto"
sketchbook_directory = "system/arduino/sketches"

# Firmware parameter values only; requirements/metadata belong to each sketch.
[firmware.board_setup_test]
# Positive integer milliseconds for each ON/OFF interval (full cycle = twice this).
BLINK_DURATION_MS = 500

[camera]
# Automatic exposure is always enabled; sensor bit depth uses system defaults.
# Output dimensions are independent of sensor resolution.
width = 640
height = 480
channels = "rgb" # "rgb" or "y" (luminance)
file_format = "numpy" # "numpy" (.npy) or "jpeg" (.jpg)
# Explicit Camera v2 full-FOV sensor settings, independent of output size.
sensor_width = 1640
sensor_height = 1232
frame_rate = 41.0 # Frames per second
jpeg_quality = 95
buffer_count = 4
warmup_seconds = 1.0
