[project]
name = "drivion-dev"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.4",
    "pillow",
    "pydantic>=2.12,<3",
    "ansible-core>=2.19.14",
    "clang-format>=23.1.3",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "tomlkit>=0.13,<1",
]

[tool.uv]
package = false

[tool.drivion.sync]
ssh_connect_timeout_seconds = 10
rsync_excludes = [
    ".venv/",
    "__pycache__/",
    "*.pyc",
    ".env",
    ".env.*",
    ".git/",
    ".pytest_cache/",
    ".ruff_cache/",
    ".ssh/",
    "/system/info.toml",
    "/system/version.toml",
    "/system/env/",
]

[tool.drivion.quality]
python_extensions = [".py", ".pyi"]
markdown_extensions = [".md"]
cpp_extensions = [".c", ".cc", ".cpp", ".cxx", ".h", ".hh", ".hpp", ".hxx", ".ino"]
