- name: Install required system packages without optional desktop recommendations
  ansible.builtin.apt:
    name: "{{ system_packages }}"
    state: present
    install_recommends: false
    lock_timeout: 120
    auto_install_module_deps: false

- name: Verify Picamera2 imports using system Python as the car user
  become: false
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - "from picamera2 import Picamera2; print('Picamera2 import OK')"
  changed_when: false
  when: not ansible_check_mode
