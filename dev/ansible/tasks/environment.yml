- name: Sync current car configuration and locked dependencies
  become: false
  delegate_to: localhost
  vars:
    ansible_python_interpreter: "{{ controller_python }}"
  ansible.builtin.command:
    argv:
      - "{{ controller_python }}"
      - "{{ controller_root }}/dev/sync/sync_car.py"
  when: not ansible_check_mode
  changed_when: true

- name: Preview the configured environment
  ansible.builtin.debug:
    msg: "Provision {{ car_environment_path }} with {{ service_python_executable }} and system-site-packages, then sync frozen car dependencies."
  when: ansible_check_mode

- name: Provision and verify the car environment
  become: false
  when: not ansible_check_mode
  block:
    - name: Read the car environment path from deployed TOML
      ansible.builtin.command:
        argv:
          - "{{ service_python_executable }}"
          - "{{ car_root }}/system/environment.py"
          - "{{ car_root }}"
      register: configured_environment
      changed_when: false
      failed_when: configured_environment.stdout != car_environment_path

    - name: Create the environment parent directory
      ansible.builtin.file:
        path: "{{ car_root }}/system/env"
        state: directory
        mode: "0755"

    - name: Create the named environment from system Python
      ansible.builtin.command:
        argv:
          - "{{ uv_executable_directory }}/uv"
          - venv
          - --python
          - "{{ service_python_executable }}"
          - --system-site-packages
          - --prompt
          - "{{ car_environment_name }}"
          - "{{ car_environment_path }}"
        creates: "{{ car_environment_path }}/pyvenv.cfg"

    - name: Verify the environment inherits the system Python packages
      ansible.builtin.command:
        argv:
          - "{{ service_python_executable }}"
          - -c
          - >-
            import pathlib, sys;
            cfg = (pathlib.Path(sys.argv[1]) / 'pyvenv.cfg').read_text();
            assert 'include-system-site-packages = true' in cfg;
            expected = f'home = {pathlib.Path(sys.argv[2]).parent}';
            assert expected in cfg, 'Environment must use configured system Python'
          - "{{ car_environment_path }}"
          - "{{ service_python_executable }}"
      changed_when: false

    - name: Install the locked Python dependencies
      ansible.builtin.command:
        argv:
          - "{{ uv_executable_directory }}/uv"
          - sync
          - --project
          - "{{ car_root }}/system"
          - --frozen
          - --python
          - "{{ service_python_executable }}"
          - --no-python-downloads
      environment:
        UV_PROJECT_ENVIRONMENT: "{{ car_environment_path }}"
        UV_CONCURRENT_DOWNLOADS: "{{ uv_concurrent_downloads }}"
        UV_CONCURRENT_BUILDS: "{{ uv_concurrent_builds }}"
        UV_CONCURRENT_INSTALLS: "{{ uv_concurrent_installs }}"
      register: environment_sync
      changed_when: "'Installed ' in environment_sync.stderr or 'Uninstalled ' in environment_sync.stderr"

    - name: Verify installed dependency consistency
      ansible.builtin.command:
        argv:
          - "{{ uv_executable_directory }}/uv"
          - pip
          - check
          - --python
          - "{{ car_environment_path }}/bin/python"
      changed_when: false

    - name: Verify configured system imports and project dependencies
      ansible.builtin.command:
        argv:
          - "{{ car_environment_path }}/bin/python"
          - "{{ car_root }}/system/verify_environment.py"
          - "{{ car_root }}"
      environment:
        OMP_NUM_THREADS: "{{ numerical_thread_limit }}"
        OPENBLAS_NUM_THREADS: "{{ numerical_thread_limit }}"
        TF_NUM_INTEROP_THREADS: "{{ numerical_thread_limit }}"
        TF_NUM_INTRAOP_THREADS: "{{ numerical_thread_limit }}"
      changed_when: false

    - name: Verify the executable car entry point from outside the car directory
      ansible.builtin.command:
        argv:
          - "{{ car_root }}/drive.py"
        chdir: "{{ temporary_directory }}"
      changed_when: false
