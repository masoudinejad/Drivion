- name: Identify the target architecture
  ansible.builtin.setup:
    gather_subset:
      - min
    filter:
      - ansible_architecture

- name: Require the supported ARM64 architecture
  ansible.builtin.assert:
    that:
      - ansible_facts.architecture == 'aarch64'
    fail_msg: The Drivion runtime supports ARM64 Raspberry Pi OS only.

- name: Inspect the installed uv version
  become: false
  ansible.builtin.command:
    argv:
      - "{{ uv_executable_directory }}/uv"
      - --version
  register: current_uv
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check whether managed uv has a newer release
  ansible.builtin.command:
    argv:
      - "{{ uv_executable_directory }}/uv"
      - self
      - update
      - --dry-run
      - --no-progress
      - --color
      - never
  environment:
    UV_NO_MODIFY_PATH: "1"
  register: uv_update_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: current_uv.rc == 0

- name: Preview uv installation or update
  ansible.builtin.debug:
    msg: >-
      {{
        'Install the latest uv release with the official managed installer.'
        if current_uv.rc != 0 or uv_update_check.rc | default(1) != 0
        else uv_update_check.stderr | trim
      }}
  changed_when: >-
    current_uv.rc != 0 or
    uv_update_check.rc | default(1) != 0 or
    'Would update uv' in uv_update_check.stderr | default('')
  when: ansible_check_mode

- name: Install uv with the official managed installer
  when:
    - not ansible_check_mode
    - current_uv.rc != 0 or uv_update_check.rc | default(1) != 0
  block:
    - name: Create a temporary uv installer file
      ansible.builtin.tempfile:
        state: file
        suffix: -uv-installer.sh
      register: uv_installer

    - name: Download the official uv installer
      ansible.builtin.get_url:
        url: "{{ uv_installer_url }}"
        dest: "{{ uv_installer.path }}"
        mode: "0755"

    - name: Install the latest managed uv release
      ansible.builtin.command:
        argv:
          - "{{ uv_installer.path }}"
      environment:
        UV_INSTALL_DIR: "{{ uv_executable_directory }}"
        UV_NO_MODIFY_PATH: "1"
      changed_when: true
  always:
    - name: Remove the temporary uv installer
      ansible.builtin.file:
        path: "{{ uv_installer.path | default('') }}"
        state: absent
      when: uv_installer.path | default('') | length > 0

- name: Update uv only when a newer release exists
  ansible.builtin.command:
    argv:
      - "{{ uv_executable_directory }}/uv"
      - self
      - update
      - --no-progress
      - --color
      - never
  environment:
    UV_NO_MODIFY_PATH: "1"
  changed_when: true
  when:
    - not ansible_check_mode
    - current_uv.rc == 0
    - uv_update_check.rc == 0
    - "'Would update uv' in uv_update_check.stderr"

- name: Verify uv is available
  become: false
  ansible.builtin.command:
    argv:
      - "{{ uv_executable_directory }}/uv"
      - --version
  changed_when: false
  when: not ansible_check_mode
