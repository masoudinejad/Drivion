- name: Check for the fallback hotspot profile
  ansible.builtin.command:
    argv:
      - "{{ wifi_command_path }}"
      - connection
      - show
      - "{{ wifi_fallback_profile }}"
  register: hotspot_profile
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create the fallback hotspot profile
  ansible.builtin.command:
    argv:
      - "{{ wifi_command_path }}"
      - connection
      - add
      - type
      - wifi
      - ifname
      - "{{ wifi_interface }}"
      - con-name
      - "{{ wifi_fallback_profile }}"
      - ssid
      - "{{ wifi_fallback_ssid_prefix }}-Setup"
  when: hotspot_profile.rc != 0 and not ansible_check_mode
  changed_when: true

- name: Inspect the fallback hotspot settings
  ansible.builtin.command:
    argv:
      - "{{ wifi_command_path }}"
      - --show-secrets
      - --escape
      - "no"
      - --get-values
      - connection.autoconnect,connection.interface-name,802-11-wireless.mode,ipv4.method,ipv4.addresses,ipv6.method,802-11-wireless-security.key-mgmt,802-11-wireless-security.psk
      - connection
      - show
      - "{{ wifi_fallback_profile }}"
  register: hotspot_configuration
  changed_when: false
  check_mode: false
  no_log: true
  when: hotspot_profile.rc == 0

- name: Configure the fallback hotspot profile
  ansible.builtin.command:
    argv:
      - "{{ wifi_command_path }}"
      - connection
      - modify
      - "{{ wifi_fallback_profile }}"
      - connection.autoconnect
      - "no"
      - connection.interface-name
      - "{{ wifi_interface }}"
      - 802-11-wireless.mode
      - ap
      - ipv4.method
      - shared
      - ipv4.addresses
      - "{{ wifi_fallback_ipv4_cidr }}"
      - ipv6.method
      - disabled
      - wifi-sec.key-mgmt
      - wpa-psk
      - wifi-sec.psk
      - "{{ lookup('ansible.builtin.env', 'DRIVION_HOTSPOT_PASSWORD') }}"
  when:
    - not ansible_check_mode
    - >-
      hotspot_profile.rc != 0 or
      hotspot_configuration.stdout_lines | default([]) != [
        'no',
        wifi_interface,
        'ap',
        'shared',
        wifi_fallback_ipv4_cidr,
        'disabled',
        'wpa-psk',
        lookup('ansible.builtin.env', 'DRIVION_HOTSPOT_PASSWORD')
      ]
  changed_when: true
  no_log: true

- name: Preview fallback hotspot configuration
  ansible.builtin.debug:
    msg: >-
      Configure {{ wifi_fallback_profile }} on {{ wifi_interface }} at
      {{ wifi_fallback_ipv4_cidr }} and activate it
      {{ wifi_fallback_delay_seconds }} seconds after boot only when Wi-Fi has
      no active connection.
  when: ansible_check_mode
  changed_when: >-
    hotspot_profile.rc != 0 or
    hotspot_configuration.stdout_lines | default([]) != [
      'no',
      wifi_interface,
      'ap',
      'shared',
      wifi_fallback_ipv4_cidr,
      'disabled',
      'wpa-psk',
      lookup('ansible.builtin.env', 'DRIVION_HOTSPOT_PASSWORD')
    ]
  no_log: true

- name: Remove the superseded version-only record
  ansible.builtin.file:
    path: "{{ car_root }}/system/version.toml"
    state: absent

- name: Create the protected Drivion service module directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ service_library_directory }}/system"
    - "{{ service_library_directory }}/system/information"
    - "{{ service_library_directory }}/system/network"
    - "{{ service_library_directory }}/system/arduino"
    - "{{ service_library_directory }}/system/arduino/device"
    - "{{ service_configuration_directory }}"
    - "{{ service_configuration_directory }}/system"

- name: Install the protected Drivion service configuration
  ansible.builtin.copy:
    src: "{{ controller_root }}/car/{{ item.source }}"
    dest: "{{ service_configuration_directory }}/{{ item.destination }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - source: config.toml
      destination: config.toml
    - source: system/pyproject.toml
      destination: system/pyproject.toml

- name: Install the protected Drivion service modules
  ansible.builtin.copy:
    src: "{{ controller_root }}/car/system/{{ item.source }}"
    dest: "{{ service_library_directory }}/system/{{ item.destination }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - source: __init__.py
      destination: __init__.py
    - source: configuration.py
      destination: configuration.py
    - source: information/__init__.py
      destination: information/__init__.py
    - source: information/update.py
      destination: information/update.py
    - source: arduino/__init__.py
      destination: arduino/__init__.py
    - source: arduino/device/__init__.py
      destination: arduino/device/__init__.py
    - source: arduino/device/discovery.py
      destination: arduino/device/discovery.py
    - source: network/__init__.py
      destination: network/__init__.py
    - source: network/fallback.py
      destination: network/fallback.py

- name: Remove the superseded protected Arduino discovery module
  # The discovery implementation moved into the device package.
  ansible.builtin.file:
    path: "{{ service_library_directory }}/system/arduino/discover.py"
    state: absent

- name: Install the system information service
  ansible.builtin.template:
    src: network/drivion-system-info.service.j2
    dest: "{{ systemd_unit_directory }}/drivion-system-info.service"
    owner: root
    group: root
    mode: "0644"

- name: Install the Wi-Fi fallback service
  ansible.builtin.template:
    src: network/drivion-wifi-fallback.service.j2
    dest: "{{ systemd_unit_directory }}/drivion-wifi-fallback.service"
    owner: root
    group: root
    mode: "0644"

- name: Install the Wi-Fi fallback timer
  ansible.builtin.template:
    src: network/drivion-wifi-fallback.timer.j2
    dest: "{{ systemd_unit_directory }}/drivion-wifi-fallback.timer"
    owner: root
    group: root
    mode: "0644"

- name: Enable SSH access
  ansible.builtin.systemd_service:
    name: ssh
    enabled: true
    state: started

- name: Enable boot-time system information refresh
  ansible.builtin.systemd_service:
    name: drivion-system-info.service
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Enable the delayed Wi-Fi fallback timer
  ansible.builtin.systemd_service:
    name: drivion-wifi-fallback.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
