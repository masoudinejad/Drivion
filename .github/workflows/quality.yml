name: Project quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        run: |
          python -m pip install uv
          uv sync --project dev --frozen --python "${{ matrix.python-version }}"
          npm ci --prefix dev
          sudo apt-get update
          sudo apt-get install -y rsync
      - name: Check formatting and lint
        run: uv run --project dev --no-sync python dev/quality/format_all.py --check
      - name: Run local tests
        run: uv run --project dev --no-sync pytest
